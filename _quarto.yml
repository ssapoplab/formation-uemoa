project:
  type: website
  output-dir: docs          # GitHub Pages publie le dossier docs/ de la branche main
  render:
    - "*.qmd"
    - "*.Rmd"
    - "!materiel/jour-3/labo-causalite/"   # labo sur EDS : microdonnées non publiées, résultats fournis en HTML
    - "!materiel/jour-4/projet-projection/"
  resources:
    - "materiel/**/*.zip"
    - "materiel/**/*.xlsx"
    - "materiel/jour-1/labo/donnees/*.csv"
    - "materiel/jour-3/labo-causalite/*-resultats.html"

website:
  title: "Formation UEMOA — Analyse démographique pour la décision publique"
  site-url: https://ssapoplab.github.io/formation-uemoa
  repo-url: https://github.com/ssapoplab/formation-uemoa
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Accueil
      - href: formateurs.qmd
        text: Formateurs
      - href: programme.qmd
        text: Programme & matériel
      - href: participants.qmd
        text: Participants
  page-footer:
    center: "Commission de l'UEMOA · Ouagadougou, 23 au 28 novembre 2026"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    lang: fr

execute:
  freeze: auto              # le code R n'est réexécuté que si le fichier change
